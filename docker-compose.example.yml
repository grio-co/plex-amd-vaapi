# Example: Plex with AMD VAAPI hardware transcoding via the musl driver fix.
# Build uses this repo's Dockerfile (linuxserver/plex + Alpine musl radeonsi).
services:
  plex:
    build:
      context: .
      args:
        # linuxserver/plex base image tag. The Dockerfile default is pinned;
        # bump this (see https://github.com/linuxserver/docker-plex/releases)
        # to move to a newer PMS / linuxserver build, then `up -d --build`.
        PLEX_VERSION: "1.43.4.10903-e5521bd8c-ls325"
        # Alpine release the musl radeonsi driver is taken from. Must not be
        # newer than the musl Plex bundles -- see README before changing.
        # ALPINE_VERSION: "3.15"
    container_name: plex
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri:/dev/dri            # GPU render node (host must expose it)
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - TZ=Etc/UTC
      # Point Plex's musl transcoder at the bundled musl radeonsi driver.
      # Keep these in `environment:` (not just Dockerfile ENV) so linuxserver's
      # s6 with-contenv exports them to PMS and the transcoder children.
      - LIBVA_DRIVERS_PATH=/opt/vaapi/dri
      - LIBVA_DRIVER_NAME=radeonsi   # use iHD/i965 for Intel instead
    volumes:
      - ./config:/config
      - /path/to/media:/media
    tmpfs:
      - /transcode:size=8g           # optional: RAM-backed transcode scratch
